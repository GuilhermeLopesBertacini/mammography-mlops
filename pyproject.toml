[project]
name = "mammography-mlops"
version = "0.1.0"
description = "Pipeline de MLOps para detecção e diagnóstico de lesões mamográficas sob DDD e Ports & Adapters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydicom>=2.4.0",
    "pydantic>=2.5.0",
    "pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "mlflow>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
